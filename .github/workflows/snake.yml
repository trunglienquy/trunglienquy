# Tên của GitHub Action
name: Generate Snake

# Điều khiển khi nào action sẽ chạy. Ở đây đặt để chạy mỗi 6 giờ.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

# Các công việc sẽ được thực hiện
jobs:
  build:
    # Chọn môi trường chạy
    runs-on: ubuntu-latest

    steps:
      # Bước kiểm tra repo để truy cập các file
      - uses: actions/checkout@v2

      # Tạo hình ảnh con rắn
      - uses: Platane/snk@master
        id: snake-gif
        with:
          github_user_name: trunglienquy  # Thay <YOUR_GITHUB_USERNAME> bằng tên GitHub của bạn
          gif_out_path: dist/github-contribution-grid-snake.gif
          svg_out_path: dist/github-contribution-grid-snake.svg

      # Kiểm tra trạng thái của git
      - run: git status

      # Đẩy thay đổi lên GitHub
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: master
          force: true

      # Đưa ảnh snake lên GitHub Pages
      - uses: crazy-max/ghaction-github-pages@v2.1.3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
